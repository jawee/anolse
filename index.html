<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anolab</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111111;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      text-align: center;
    }

    img {
      display: block;
      max-width: min(520px, 90vw);
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.1rem;
    }

    a:hover,
    a:focus-visible {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/anolab.png" alt="Anolab logo">
    <a href="mailto:olsson.andreas+anolab@gmail.com">olsson.andreas+anolab@gmail.com</a>
  </main>
</body>
</html>
